<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Demonstração encerrada · IO Tecnologia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: Montserrat, system-ui, sans-serif;
    color: #fff;
    background: radial-gradient(120% 80% at 50% 30%, #12345C 0%, #0A1C34 55%, #061021 100%);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .caixa {
    width: 100%; max-width: 560px; text-align: center;
    padding: 48px 36px; border-radius: 24px;
    background: rgba(255,255,255,.04); border: 1px solid rgba(145,175,199,.22);
    box-shadow: 0 30px 80px rgba(0,0,0,.35);
  }
  .icone {
    width: 72px; height: 72px; margin: 0 auto 24px; border-radius: 50%;
    display: grid; place-items: center;
    background: rgba(44,212,230,.12); border: 2px solid rgba(44,212,230,.45);
  }
  h1 { margin: 0 0 14px; font-size: 30px; line-height: 1.2; font-weight: 800; }
  p { margin: 0 0 12px; font-size: 16px; line-height: 1.6; color: #C9D8E8; }
  .marca { margin-top: 34px; padding-top: 24px; border-top: 1px solid rgba(145,175,199,.2); }
  .marca b { display: block; font-size: 20px; letter-spacing: 4px; font-weight: 800; }
  .marca span { display: block; margin-top: 6px; font-size: 13px; color: #91AFC7; }
  @media (max-width: 420px) { .caixa { padding: 36px 22px; } h1 { font-size: 24px; } }
</style>
</head>
<body>
  <main class="caixa">
    <div class="icone" aria-hidden="true">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#2CD4E6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    </div>
    <h1>O período de demonstração foi encerrado</h1>
    <p>O acesso a este sistema de demonstração não está mais disponível.</p>
    <p>Para retomar o acesso ou conhecer as condições de contratação, entre em contato com a IO Tecnologia.</p>
    <div class="marca">
      <b>IO TECNOLOGIA</b>
      <span>Sua empresa na palma da mão</span>
    </div>
  </main>
</body>
</html>
